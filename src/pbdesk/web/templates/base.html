<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}pbdesk · local status{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script defer src="{{ url_for('static', path='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
  <script type="module" src="{{ url_for('static', path='js/app.js') }}"></script>
</head>
<body>
  <header class="site-header"><div class="container header-inner"><strong><span class="plane" aria-hidden="true">➤</span> pbdesk</strong><span class="local-label">Local status</span><span class="local-only">This computer only</span></div></header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer class="container">pbdesk · Private core and local web companion</footer>
</body>
</html>
