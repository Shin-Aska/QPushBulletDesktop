name: AppImage candidate

on:
  workflow_dispatch:
  push:
    branches: ['main', 'build/**']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # Download the independently pinned initial upgrade baseline.
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Enforce deliberate final tag only
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
            python3 packaging/release_guard.py --tag "${REF#refs/tags/}" --visibility "$visibility"
          fi
      - name: Install build and test OS libraries on temporary runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            squashfs-tools patchelf file libfuse2t64 xvfb xauth xdotool dbus-x11 \
            libgl1 libegl1 libopengl0 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-randr0 \
            libxcb-xfixes0 libxcb-sync1 libxrender1 libxi6 libxfixes3 libxrandr2 libxtst6
      - name: Seed exact SHA256-verified official CPython tool cache
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, tempfile, urllib.request
          pin = json.loads(pathlib.Path('packaging/toolchain.json').read_text())['python']
          stage = pathlib.Path(tempfile.mkdtemp(prefix='pbdesk-python-', dir=os.environ['RUNNER_TEMP']))
          archive = stage / 'python.tar.gz'
          with urllib.request.urlopen(pin['url'], timeout=60) as response, archive.open('wb') as output:
              shutil.copyfileobj(response, output)
          with archive.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == pin['sha256'], 'CPython SHA256 mismatch'
          unpack = stage / 'unpack'
          unpack.mkdir()
          subprocess.run(['tar', '-xzf', str(archive), '-C', str(unpack)], check=True)
          cache = pathlib.Path(os.environ['RUNNER_TOOL_CACHE']) / 'Python' / pin['version']
          shutil.rmtree(cache / 'x64', ignore_errors=True)
          (cache / 'x64.complete').unlink(missing_ok=True)
          # Mirror the official archive layout without setup.sh's floating pip upgrade.
          shutil.copytree(unpack, cache / 'x64', symlinks=True)
          (cache / 'x64/setup.sh').unlink(missing_ok=True)
          for path, target in [(cache / 'x64/python', 'bin/python3.14'),
                               (cache / 'x64/bin/python', 'python3.14'),
                               (cache / 'x64/bin/python314', 'python3.14')]:
              if not path.exists():
                  path.symlink_to(target)
          (cache / 'x64.complete').touch()
          PY
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14.4'
          architecture: x64
          check-latest: false
      - name: Create separate hash-locked regression and production build environments
        run: |
          python -m venv .test-venv
          .test-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements-test.lock
          .test-venv/bin/python -m pip install --no-build-isolation --no-deps .
          .test-venv/bin/python -m pip check
          python -m venv .build-venv
          .build-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-build.lock -r packaging/requirements-runtime.lock
          .build-venv/bin/python -m pip install --no-build-isolation --no-deps .
          .build-venv/bin/python -m pip check
      - name: Build self-contained candidate
        run: .build-venv/bin/python packaging/build_appimage.py
      - name: Smoke actual AppImage outside checkout on isolated session bus and display
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          image=$(find "$PWD/dist" -maxdepth 1 -name 'pbdesk-*-x86_64.AppImage' -print -quit)
          test -n "$image"
          dbus-run-session -- xvfb-run -a .test-venv/bin/python packaging/smoke.py "$image" --output "$PWD/dist/smoke-evidence.json"
      - name: Run repository regression tests
        run: .test-venv/bin/python -m pytest -q --junitxml=dist/regression-results.xml
      - name: Select independently pinned published or upgrade baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(.test-venv/bin/python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          baseline_args=()
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then baseline_args+=(--allow-same-published); fi
          .test-venv/bin/python packaging/baseline.py --target "$version" "${baseline_args[@]}" \
            --destination "$RUNNER_TEMP/pbdesk-upgrade-baseline" \
            --selection "$PWD/dist/baseline-selection.json" --github-output "$GITHUB_OUTPUT"
      - name: Verify actual replacement recovery and interrupted migration
        env:
          QT_QPA_PLATFORM: xcb
          OLD_IMAGE: ${{ steps.baseline.outputs.image }}
          BASELINE_SHA256: ${{ steps.baseline.outputs.sha256 }}
          BASELINE_SOURCE: ${{ steps.baseline.outputs.source_revision }}
          BASELINE_VERSION: ${{ steps.baseline.outputs.version }}
          CLASSIFICATION: ${{ steps.baseline.outputs.classification }}
        run: |
          image=$(find "$PWD/dist" -maxdepth 1 -name 'pbdesk-*-x86_64.AppImage' -print -quit)
          .test-venv/bin/python packaging/verify_release.py --old-image "$OLD_IMAGE" --new-image "$image" \
            --baseline-sha256 "$BASELINE_SHA256" --baseline-source-revision "$BASELINE_SOURCE" \
            --baseline-version "$BASELINE_VERSION" --classification "$CLASSIFICATION" \
            --smoke-evidence "$PWD/dist/smoke-evidence.json" --output "$PWD/dist/release-acceptance.json"
      - name: Finalize external readiness without changing tested image
        env:
          CLASSIFICATION: ${{ steps.baseline.outputs.classification }}
        run: |
          .test-venv/bin/python packaging/finalize_release.py --assets "$PWD/dist" --classification "$CLASSIFICATION"
          .test-venv/bin/python packaging/finalize_release.py --assets "$PWD/dist" --classification "$CLASSIFICATION" --verify-only
          cd dist
          sha256sum --check pbdesk-*-SHA256SUMS
      - name: Upload short-lived candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pbdesk-appimage-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Upload unverified candidate and sanitized failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pbdesk-appimage-unverified-failure-${{ github.run_id }}
          # Explicit files only: never include synthetic profiles, cache, wallet
          # material or raw child logs. Failed candidates are NOT validated builds.
          path: |
            dist/smoke-evidence.json
            dist/release-acceptance.json
            dist/baseline-selection.json
            dist/pbdesk-*-x86_64.AppImage
            dist/pbdesk-*-build-info.json
            dist/pbdesk-*-source-progress.json
            dist/pbdesk-*-corresponding-source.json
            dist/pbdesk-*-SHA256SUMS
            dist/pbdesk-*-source.tar.gz
            dist/pbdesk-*-licenses.tar.gz
            build/appimage/pyinstaller/pbdesk-appimage/warn-pbdesk-appimage.txt
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

  # Only a matching stable tag can reach this separate write-permission job.
  # It independently validates the completed immutable bundle and creates a draft.
  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Recheck visibility, exact version and release readiness
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
          python3 packaging/release_guard.py --tag "$TAG" --visibility "$visibility"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pbdesk-appimage-${{ github.sha }}
          path: release-assets
      - name: Validate complete source acceptance and checksum evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y squashfs-tools
          visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
          python3 packaging/release_guard.py --tag "$TAG" --visibility "$visibility" --assets "$PWD/release-assets"
      - name: Create owner-reviewed draft only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum --check pbdesk-*-SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "pbdesk $TAG" --notes-file "$GITHUB_WORKSPACE/docs/release-notes-1.0.0.md" ./*
